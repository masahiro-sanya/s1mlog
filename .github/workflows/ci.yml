name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    outputs:
      playwright-version: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # e2e のコンテナのタグを lockfile の @playwright/test に揃える（Dependabot が上げても自動で追従する）
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      # ロックファイルをコミット管理しているため再現ビルドを担保する npm ci を使う
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      # microCMS の API キーがなくてもフォールバックでビルドが通ることを保証する
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ブラウザと apt 依存入りのイメージを使い、--with-deps の apt 取得（遅い回線で30分かかった）を避ける。
    # タグは ci ジョブが lockfile から読んだ @playwright/test のバージョン。
    # apt を使わないので、イメージとパッケージがずれると OS 依存が足りず落ちる。
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.ci.outputs.playwright-version }}-noble
      options: --user 1001
    # lint / 型 / ユニットテストが通ってから、時間のかかる E2E を回す
    needs: ci
    defaults:
      run:
        working-directory: front
    env:
      MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
      MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # headers() はビルド時に確定するため、build ステップから見える位置で渡す必要がある
      ALLOW_INSECURE_HTTP: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      # E2E は実際の記事が並ぶことを前提にしているため、キーが無いと必ず落ちる。
      # 原因が分かる形で先に止める。
      - name: Check microCMS credentials
        run: |
          if [ -z "$MICROCMS_API_KEY" ] || [ -z "$MICROCMS_SERVICE_DOMAIN" ]; then
            echo "::error::E2E には microCMS の認証情報が必要です。Settings > Secrets and variables > Actions に MICROCMS_API_KEY と MICROCMS_SERVICE_DOMAIN を登録してください。"
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install

      # playwright.config.ts の webServer は CI では npm run start を使うため、先にビルドしておく
      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test

      # timeout-minutes 超過も cancelled 扱いになるため always() にし、詰まった回のレポートも残す
      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 7
